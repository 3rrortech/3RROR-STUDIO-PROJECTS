<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sipho’s Kota Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Permanent+Marker&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#040404;--card:#121212;--line:#2a2a2a;--tx:#f5f5f5;--mut:#a0a0a0;--or:#ff7a00;--or2:#ffa24d;--gr:#22c55e;--d:"Bowlby One",Impact,sans-serif;--m:"Permanent Marker",cursive;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 "DM Sans",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:60}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--gr);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(4,4,4,.95);backdrop-filter:blur(8px);border-bottom:2px solid var(--or);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px}
.logo{font:400 17px/1 var(--d);color:var(--or);white-space:nowrap}
.logo span{color:var(--tx)}
nav{display:flex;gap:2px}
.tab{padding:8px 10px;font-weight:700;font-size:14px;color:var(--mut);border-radius:8px}
.tab.on{color:#000;background:var(--or)}
#hero{position:relative;min-height:300px;display:flex;align-items:flex-end;background:radial-gradient(circle at 80% 20%,#ff7a0066,transparent 55%),linear-gradient(160deg,#1a0d00,#040404);background-size:cover;background-position:center top}
#hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#040404 5%,transparent 70%)}
#hero .in{position:relative;z-index:1;padding:20px 16px 18px;max-width:760px;margin:0 auto;width:100%}
#hero .ph{font-size:80px;line-height:1;position:absolute;right:16px;top:-170px;opacity:.9}
#hero h1{font:400 38px/1 var(--d);margin:0 0 8px}
#hero h1 em{font-style:normal;color:var(--or)}
#hero p{font:400 20px/1.2 var(--m);color:var(--or2);margin:0 0 14px}
.pill2{display:inline-block;background:rgba(34,197,94,.15);color:var(--gr);border:1px solid var(--gr);border-radius:20px;padding:3px 12px;font-weight:700;font-size:13px}
main{padding:6px 14px 120px;max-width:760px;margin:0 auto;min-height:50vh}
h2{font:400 24px/1 var(--d);margin:26px 0 12px;color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%}
.card .tile{font-size:46px;text-align:center;padding:14px 0;background:linear-gradient(135deg,#ff7a0033,#22c55e14)}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card b{font-size:16px}.card small{color:var(--mut);flex:1}
.card.so{opacity:.45}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.pr{font-weight:700;font-size:17px;color:var(--gr)}
.add,.btn{background:var(--or);color:#000;font-weight:700;border-radius:10px;padding:8px 16px}
.btn{width:100%;padding:14px;font-size:16px;margin-top:6px}
.btn.g{background:var(--gr)}.btn.o{background:none;border:1px solid var(--line);color:var(--tx)}
.lnk{display:block;margin:12px auto 0;color:var(--or2);text-decoration:underline;font-size:14px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;color:var(--mut)}
.pill.on{border-color:var(--gr);color:var(--gr);background:rgba(34,197,94,.1)}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
.ing span{background:#1c1c1c;border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px}
#bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:736px;margin:0 auto;z-index:40;display:none;align-items:center;justify-content:space-between;background:var(--or);color:#000;border-radius:16px;padding:14px 18px;font-weight:700;box-shadow:0 6px 24px rgba(255,122,0,.4)}
#bar.show{display:flex}#bar i{font-style:normal;background:#000;color:var(--or2);border-radius:10px;padding:5px 12px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
#sheet{background:#0d0d0d;border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:90vh;overflow:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
#sheet h3{font:400 22px/1.1 var(--d);margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 12px}
.big{font-size:64px;text-align:center}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.line .n{flex:1}.line small{display:block;color:var(--mut)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);font-size:18px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:14px 0 6px}.tot span:last-child{color:var(--gr)}
input[type=text],input[type=tel],input[type=email],input[type=password]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:13px;font:inherit;margin-bottom:8px}
.note{color:var(--mut);font-size:12px;text-align:center;margin:8px 0 0}.err{color:#ef4444;font-size:13px;margin:6px 0 0}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top2{display:flex;justify-content:space-between;align-items:center;gap:8px}
.oid{font:400 17px/1 var(--d)}.paid{color:var(--gr);font-size:12px;font-weight:700}
.items{color:var(--mut);font-size:13px;margin:6px 0 8px}
.steps{display:flex;gap:4px;margin:10px 0}.steps div{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps .d{background:var(--gr)}.steps .c{background:var(--or)}
.msg{font-weight:700}.msg.ready{color:#000;background:var(--gr);border-radius:10px;padding:12px}
.stat{display:flex;gap:10px;margin:12px 0}.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font:400 26px/1.2 var(--d);color:var(--or2)}
.badge{border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--or);color:#000}.badge.g{background:var(--gr)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative}.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--gr)}.sw.on::after{left:23px}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.steps4{display:grid;gap:10px}.steps4 div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.steps4 b{color:var(--or2)}
footer{border-top:2px solid var(--or);background:#0a0a0a;padding:26px 14px calc(30px + env(safe-area-inset-bottom,0px));text-align:center}
.soc{display:flex;justify-content:center;gap:14px;margin-bottom:16px}
.soc a{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--or2)}
.soc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
footer .lk{color:var(--mut);font-size:14px;text-decoration:underline}
footer p{margin:8px 0 0;color:var(--mut);font-size:13px}footer p b{color:var(--or)}
.spin{width:42px;height:42px;border:4px solid var(--line);border-top-color:var(--or);border-radius:50%;margin:30px auto 14px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}#hero h1{font-size:52px}}
@media(max-width:380px){.tab{padding:8px 7px;font-size:13px}.logo{font-size:15px}}
</style>
</head>

const imgFor=m=>m.img?IMG[m.img[Math.min(sel[m.id]||0,m.img.length-1)]]:null;
const tileStyle=m=>imgFor(m)?`all:unset;cursor:pointer;display:block;height:120px;background:url(${imgFor(m)}) center/cover`:"all:unset;cursor:pointer;display:block;font-size:46px;text-align:center;padding:14px 0;background:linear-gradient(135deg,#ff7a0033,#22c55e14)";
const MENU=[
{id:'k1',cat:'Kotas',e:'🥪',name:'Russian Kota',price:20,desc:'The classic. A quarter loaf stuffed with a grilled Russian and hot chips.',ing:['Quarter white loaf','Grilled Russian','Hot chips','Atchar','Tomato sauce']},
{id:'k3',cat:'Kotas',e:'🧀',name:'Cheese Kota',price:25,desc:'Melted cheese over fresh chips.',ing:['Quarter white loaf','Hot chips','Melted cheese','Atchar','Tomato sauce']},
{id:'k4',cat:'Kotas',e:'🥓',name:'Bacon and Egg Kota',price:30,desc:'Crispy bacon and a fried egg on a chips base.',ing:['Quarter white loaf','Crispy bacon','Fried egg','Cheese slice','Hot chips','Tomato sauce']},
{id:'r1',cat:'Russians',e:'🌭',name:'Russian',price:10,img:['rus'],desc:'One grilled Russian with sauce.',ing:['Grilled Russian','Tomato sauce','Mustard']},
{id:'r2',cat:'Russians',e:'🌭',name:'Russian and Chips',price:30,img:['rus2'],desc:'A grilled Russian on a pile of hot chips.',ing:['Grilled Russian','Hot chips','Tomato sauce','Salt']},
{id:'c1',cat:'Chips',e:'🍟',name:'Chips',desc:'Fresh cut and fried to order.',ing:['Fresh potatoes','Sunflower oil','Salt','Vinegar on request'],img:['cs','cm','cl'],opts:[['Small',15],['Medium',20],['Large',25]]},
{id:'d1',cat:'Drinks',e:'🍵',name:'Black Tea',desc:'Hot, strong, the way it should be.',ing:['Hot water','Black tea bag','Sugar on request','Milk if you choose it'],opts:[['No milk',10],['With milk',12]]},
{id:'d2',cat:'Drinks',e:'☕',name:'Coffee',desc:'Hot instant coffee.',ing:['Hot water','Instant coffee','Sugar on request','Milk if you choose it'],opts:[['No milk',5],['With milk',7]]}
];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mm={};
const ls={g(k,d){try{const v=localStorage.getItem(k);if(v)return JSON.parse(v)}catch(e){}return k in mm?mm[k]:d},s(k,v){mm[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let U=ls.g('sk_user',null),view='menu',cart={},sel={},lock=false;
const orders=()=>ls.g('sk_orders',[]),out=()=>ls.g('sk_out',[]),isO=()=>U&&U.role==='owner';
const total=()=>Object.values(cart).reduce((a,l)=>a+l.price*l.qty,0),count=()=>Object.values(cart).reduce((a,l)=>a+l.qty,0);
const priceOf=m=>m.opts?m.opts[sel[m.id]||0][1]:m.price;
const sheet=(h,l)=>{lock=!!l;$('#sheet').innerHTML=h;$('#ov').classList.add('show')};
window.closeSheet=()=>{$('#ov').classList.remove('show');render()};
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'&&!lock)closeSheet()});

function hero(){const p=ls.g('sk_hero',null);if(p){$('#hero').style.backgroundImage=`url(${p})`;$('#hero .ph').style.display='none'}}
window.photo=inp=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,900/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ls.s('sk_hero',c.toDataURL('image/jpeg',.8));hero()};im.src=r.result};r.readAsDataURL(f)};

window.welcome=mode=>{
  const o=mode==='o';
  sheet(`<h3>${o?'Owner login':'Welcome to Sipho’s'}</h3><p class="sub">${o?'Sign in to manage orders and the menu.':'Tell us who you are once. We’ll remember you next time.'}</p>`+
  (o?`<input type="tel" id="f1" placeholder="Owner cell number"><input type="password" id="f2" placeholder="PIN"><p class="note">Demo login: 071 000 0000 and PIN 2024</p>`:
  `<input type="text" id="f1" placeholder="Your name" autocomplete="name"><input type="tel" id="f2" placeholder="Cell number" autocomplete="tel"><input type="email" id="f3" placeholder="Email (optional)" autocomplete="email">`)+
  `<p class="err" id="er"></p><button class="btn" onclick="login('${mode}')">${o?'Sign in as Sipho':'Start ordering'}</button><button class="lnk" onclick="welcome('${o?'c':'o'}')">${o?'I’m a customer':'I’m the owner'}</button>`,true);
};
window.login=mode=>{
  const a=$('#f1').value.trim(),b=$('#f2').value.trim(),d=(b).replace(/\D/g,'');
  if(mode==='o'){const p=a.replace(/\D/g,'');if(p!==OWNER.phone||b!==OWNER.pin){$('#er').textContent='Wrong cell number or PIN.';return}U={name:'Sipho',phone:p,role:'owner'};view='dash'}
  else{if(a.length<2||d.length<9){$('#er').textContent='Add your name and a valid cell number.';return}U={name:a,phone:d,email:($('#f3').value||'').trim(),role:'customer'}}
  ls.s('sk_user',U);cart={};closeSheet();
};
window.logout=()=>{ls.s('sk_user',null);U=null;cart={};view='menu';render();welcome('c')};

function menuView(){return [...new Set(MENU.map(m=>m.cat))].map(c=>`<h2>${c}</h2><div class="grid">${MENU.filter(m=>m.cat===c).map(card).join('')}</div>`).join('')}
function card(m){const so=out().includes(m.id);return `<div class="card ${so?'so':''}"><button class="tile" onclick="openItem('${m.id}')" aria-label="${m.name} details" style="${tileStyle(m)}">${imgFor(m)?'':m.e}</button><div class="bd"><b>${m.name}</b><small>${m.opts?'From R'+m.opts[0][1]:'Tap for ingredients'}</small><div class="row"><span class="pr">R${m.opts?m.opts[0][1]:m.price}</span>${so?'<span class="badge">Sold out</span>':`<button class="add" onclick="openItem('${m.id}')">${isO()?'View':'Add'}</button>`}</div></div></div>`}
window.openItem=id=>{
  const m=MENU.find(x=>x.id===id),i=sel[id]||0,so=out().includes(id);
  sheet(`${imgFor(m)?`<div role="img" aria-label="${m.name}" style="height:210px;border-radius:14px;background:url(${imgFor(m)}) center/cover;margin-bottom:12px"></div>`:`<div class="big">${m.e}</div>`}<h3>${m.name}</h3><p class="sub">${m.desc}</p><b>What’s inside</b><div class="ing">${m.ing.map(x=>`<span>${x}</span>`).join('')}</div>`+
  (m.opts?`<div class="pills">${m.opts.map((x,j)=>`<button class="pill ${j===i?'on':''}" onclick="sel['${id}']=${j};openItem('${id}')">${x[0]} · R${x[1]}</button>`).join('')}</div>`:'')+
  `<div class="row"><span class="pr">R${priceOf(m)}</span>${so?'<span class="badge">Sold out</span>':isO()?'':`<button class="add" onclick="add('${id}');closeSheet()">Add to cart</button>`}</div>`);
};
window.sel=sel;
window.go=v=>{view=v;render()};
window.add=id=>{const m=MENU.find(x=>x.id===id),i=sel[id]||0,k=id+'|'+i;if(cart[k])cart[k].qty++;else cart[k]={name:m.name,opt:m.opts?m.opts[i][0]:'',price:priceOf(m),qty:1}};
window.chg=(k,d)=>{cart[k].qty+=d;if(cart[k].qty<=0)delete cart[k];count()?openCart():closeSheet()};
window.openCart=()=>{
  if(!count())return;
  sheet(`<h3>Your cart</h3>`+Object.entries(cart).map(([k,l])=>`<div class="line"><div class="n">${l.name}<small>${l.opt?l.opt+' · ':''}R${l.price} each</small></div><div class="qty"><button onclick="chg('${k}',-1)" aria-label="Remove one">−</button><b>${l.qty}</b><button onclick="chg('${k}',1)" aria-label="Add one">+</button></div></div>`).join('')+
  `<div class="tot"><span>Total to pay</span><span>R${total()}</span></div><p class="sub">Ordering as ${esc(U.name)} · ${esc(U.phone)}</p><button class="btn" onclick="pay()">Pay R${total()} online</button><p class="note">Full payment online with Yoco or Paystack. Prototype: no real money moves.</p>`);
};
window.pay=()=>{
  const amt=total(),lines=Object.values(cart);
  sheet(`<div class="spin"></div><p class="empty" style="padding:0 0 30px">Connecting to secure payment for R${amt}…</p>`,true);
  setTimeout(()=>{
    const o={id:'SK-'+Math.floor(1000+Math.random()*9000),name:U.name,phone:U.phone,total:amt,lines,status:0,t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
    ls.s('sk_orders',[o,...orders()]);cart={};view='dash';
    sheet(`<div class="empty" style="padding:24px 0"><div style="font-size:46px">✅</div><h3>Payment received</h3><p>Order ${o.id} · R${o.total}<br>Sipho can see it now. Track it on your dashboard.</p></div><button class="btn g" onclick="closeSheet()">Go to my dashboard</button>`);
  },1600);
};
const desc=o=>o.lines.map(l=>`${l.qty}× ${l.name}${l.opt?' ('+l.opt+')':''}`).join(' · ');
const steps=s=>`<div class="steps">${[0,1,2,3,4].map(i=>`<div class="${s>=4||i<s?'d':i===s?'c':''}"></div>`).join('')}</div>`;
function ordCard(o,mine){return `<div class="oc"><div class="top2"><span class="oid">${o.id}${mine?'':' · '+esc(o.name)}</span><span class="paid">Paid R${o.total} · ${o.t}</span></div><div class="items">${desc(o)}</div>${steps(o.status)}`+
  (mine?`<div class="msg ${o.status===4?'ready':''}">${ST[o.status]}. ${MSG[o.status]}</div>${o.status>=4?`<button class="btn o" onclick="reorder('${o.id}')">Order this again</button>`:''}`:
  `<div class="top2"><span class="badge ${o.status>=4?'g':''}">${ST[o.status]}</span>${o.status<5?`<button class="add" onclick="nxt('${o.id}')">Move to ${ST[o.status+1]}</button>`:''}</div>`)+`</div>`}
window.nxt=id=>{ls.s('sk_orders',orders().map(o=>o.id===id?{...o,status:Math.min(5,o.status+1)}:o));render()};
window.reorder=id=>{orders().find(o=>o.id===id).lines.forEach(l=>{cart['re|'+l.name+l.opt]={...l}});view='menu';render();openCart()};
window.tog=id=>{const o=out();ls.s('sk_out',o.includes(id)?o.filter(x=>x!==id):[...o,id]);render()};

function dashView(){
  if(!U)return `<div class="empty"><p>Sign in to see your dashboard.</p><button class="btn" onclick="welcome('c')">Sign in</button></div>`;
  const all=orders();
  if(isO()){
    const act=all.filter(o=>o.status<4).length,rev=all.reduce((a,o)=>a+o.total,0);
    return `<h2>Hi Sipho</h2><p class="sub">Owner dashboard</p><div class="stat"><div><b>${act}</b>Active orders</div><div><b>R${rev}</b>Paid online</div></div>
    <h2>Live orders</h2>${all.length?all.map(o=>ordCard(o,false)).join(''):'<div class="empty">No orders yet. Paid orders appear here instantly.</div>'}
    <h2>Menu availability</h2>${MENU.map(m=>`<div class="tg"><span>${m.e} ${m.name}</span><button class="sw ${out().includes(m.id)?'':'on'}" onclick="tog('${m.id}')" aria-label="Toggle ${m.name} available"></button></div>`).join('')}
    <h2>Shop photo</h2><p class="sub">This photo shows at the top of the site.</p><input type="file" accept="image/*" onchange="photo(this)" style="color:var(--mut);margin-bottom:14px">
    <button class="btn o" onclick="logout()">Sign out</button>`;
  }
  const mine=all.filter(o=>o.phone===U.phone),act=mine.filter(o=>o.status<5),past=mine.filter(o=>o.status>=5);
  return `<h2>Hi ${esc(U.name.split(' ')[0])}</h2><p class="sub">${esc(U.phone)}${U.email?' · '+esc(U.email):''}</p>
  <h2>Your orders</h2>${act.length?act.map(o=>ordCard(o,true)).join(''):'<div class="empty">No active orders. Pick something from the menu.</div><button class="btn" onclick="go(\'menu\')">Browse the menu</button>'}
  ${past.length?`<h2>Past orders</h2>${past.map(o=>ordCard(o,true)).join('')}`:''}
  <button class="btn o" style="margin-top:18px" onclick="logout()">Not you? Sign out</button>`;
}
function aboutView(){return `<h2>Meet Sipho</h2><p class="sub">Add Sipho’s story here: how long he has been cooking, where the shop is, and what makes his kotas different.</p>
<h2>How ordering works</h2><div class="steps4"><div><b>1. Pick</b><br>Tap any item to see what’s inside it.</div><div><b>2. Pay online</b><br>Pay the full amount with Yoco or Paystack.</div><div><b>3. Track</b><br>Watch it go from cooking to preparing to ready.</div><div><b>4. Collect</b><br>Walk in when it says ready and pick up hot.</div></div>
<h2>Find us</h2><div class="steps4"><div><b>Hours</b><br>Add trading hours here.</div><div><b>Address</b><br>Add Sipho’s street address here.</div></div>`}
window.policy=()=>sheet(`<h3>Privacy policy</h3><p class="sub">How Sipho’s Kota Shop handles your information (POPIA).</p><p><b>What we collect:</b> your name, cell number, optional email and your order history.</p><p><b>Why:</b> to take your order, show you its status and recognise you next time.</p><p><b>Sharing:</b> we never sell your details. Payments are handled by our payment provider and we do not store card numbers.</p><p><b>Your rights:</b> ask us to see, fix or delete your information at any time.</p><p class="note">Draft text. Have it reviewed before launch.</p><button class="btn" onclick="closeSheet()">Close</button>`);

function render(){
  $('#app').innerHTML=view==='menu'?menuView():view==='about'?aboutView():dashView();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===view));
  $('#acc').textContent=U?(isO()?'Dashboard':U.name.split(' ')[0].slice(0,10)):'Sign in';
  const n=count();$('#bl').textContent=`🛒 ${n} item${n===1?'':'s'} · R${total()}`;
  $('#bar').classList.toggle('show',n>0&&view!=='dash'&&!isO());
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.v;if(view==='dash'&&!U){welcome('c');return}render();scrollTo(0,$('#hero').offsetHeight)});
addEventListener('storage',()=>{if(!$('#ov').classList.contains('show'))render()});
setInterval(()=>{if(view==='dash'&&!$('#ov').classList.contains('show'))render()},2500);
hero();render();if(!U)welcome('c');
}catch(e){document.getElementById('app').innerHTML='<div class="empty">Something broke: '+e.message+'</div>'}
</script>
</body>
</html>
